# Project-local OpenHands Config
# Symlinked to .openhands/config.yaml in project root
# Commit this to your project repo

llm:
  model: "${REASONING_MODEL:-claude-sonnet-4-20250514}"
  api_key: "${ANTHROPIC_API_KEY}"
  base_url: "https://api.anthropic.com"
  temperature: 0.0
  max_tokens: 8192

workspace:
  mount_path: "/workspace"
  repo_path: "."

agents:
  default: "CodeActAgent"
  available:
    - "CodeActAgent"
    - "BrowsingAgent"

security:
  confirmation_mode: true
  allowed_commands:
    - "git"
    - "npm"
    - "pnpm"
    - "yarn"
    - "python"
    - "pip"
    - "pytest"
    - "cargo"
    - "go"
    - "make"
    - "docker"
    - "kubectl"
    - "terraform"
    - "ansible"
    - "jq"
    - "curl"
    - "wget"
    - "tar"
    - "gzip"
    - "unzip"
    - "rsync"
    - "ssh"
    - "scp"

memory:
  enabled: true
  max_size: 1000
  persistence_path: ".openhands/memory"

runtime:
  type: "docker"
  image: "ghcr.io/all-hands-ai/openhands:latest"
  docker_options:
    - "--network=host"
    - "--add-host=host.docker.internal:host-gateway"
  cpu_limit: "4"
  memory_limit: "8g"
  env:
    - "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
    - "OPENAI_API_KEY=${OPENAI_API_KEY}"
    - "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}"
    - "GOOGLE_API_KEY=${GOOGLE_API_KEY}"
    - "GITHUB_TOKEN=${GITHUB_TOKEN}"

sandbox:
  enabled: true
  type: "docker"

telemetry:
  enabled: false

plugins:
  enabled: true
  directory: ".openhands/plugins"

logging:
  level: "INFO"
  file: ".openhands/logs/openhands.log"
  max_files: 10
  max_size_mb: 100

agent_config:
  CodeActAgent:
    max_iterations: 50
    browser_enabled: true
    skills: []

  BrowsingAgent:
    max_pages: 10
    search_engine: "duckduckgo"
    headless: true