# ==========================================
# MODEL PROFILES - Map tasks to models
# ==========================================
profiles:
  # Fast, cheap coding tasks (edits, boilerplate, simple features)
  coding-fast:
    primary: gpt-4o-mini
    fallback: qwen2.5-coder-14b
    description: "Quick edits, boilerplate, simple features"

  # Deep reasoning, architecture, complex refactoring
  reasoning-deep:
    primary: claude-sonnet-4
    fallback: o1-preview
    description: "Architecture decisions, complex refactoring, planning"

  # Architecture design, system design, tech choices
  architecture:
    primary: claude-opus-4
    fallback: claude-sonnet-4
    description: "System design, tech selection, architectural review"

  # Thorough code review, security audit, performance analysis
  review-thorough:
    primary: claude-sonnet-4
    fallback: gpt-4o
    description: "PR review, security audit, performance analysis"

  # Local-only for sensitive code, offline, or free
  local-only:
    primary: qwen2.5-coder-32b
    fallback: codellama-34b
    description: "Private code, offline work, zero cost"

  # Test generation
  test-generation:
    primary: gpt-4o-mini
    fallback: qwen2.5-coder-14b
    description: "Unit tests, integration tests, edge cases"

  # Documentation writing
  docs-writing:
    primary: claude-sonnet-4
    fallback: gpt-4o
    description: "API docs, README, architecture docs, comments"

  # Debugging assistance
  debugging:
    primary: claude-sonnet-4
    fallback: o1-mini
    description: "Root cause analysis, stack trace interpretation"

  # Learning/explanation
  learning:
    primary: claude-sonnet-4
    fallback: gemini-1.5-flash
    description: "Code explanation, concept teaching, onboarding"

# ==========================================
# PROVIDER DEFAULTS
# ==========================================
provider_defaults:
  anthropic:
    default_model: claude-sonnet-4
    api_version: "2023-06-01"
  openai:
    default_model: gpt-4o
  google:
    default_model: gemini-1.5-pro
  openrouter:
    default_model: deepseek-v3
  ollama:
    default_model: qwen2.5-coder-32b
    default_base_url: http://localhost:11434